<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Edufunnel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h1>Edufunnel</h1>
        <span>Analytical Intelligence</span>
      </div>
      
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item active">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          Dashboard
        </a>
        <a href="traffic-sources.html" class="nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
          </svg>
          Traffic Sources
        </a>
        <a href="annual-stages.html" class="nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
           <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
          Annual Stages
        </a>
      </nav>
      
      <div class="sidebar-footer">
        <button class="logout-btn" onclick="window.location.href='index.html'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Logout
        </button>
      </div>
    </aside>
    
    <!-- Main Content -->
    <main class="main-content">
      <header class="header">
        <h1>Edufunnel Intelligence Dashboard</h1>
        <div class="header-right">
      </header>
      
      <div class="page-content">
        <!-- Stats Cards -->
        <div class="stats-grid">
          <div class="stat-card">
            <p class="stat-label">Total Leads</p>
            <div class="stat-value">
              <h2 id="stat-total-leads">...</h2>
              <span class="stat-change" id="stat-total-change">...</span>
            </div>
          </div>

          <div class="stat-card">
            <p class="stat-label">Retention Rate</p>
            <div class="stat-value">
              <h2 id="stat-retention-rate">...</h2>
            </div>
          </div>

          <div class="stat-card">
            <p class="stat-label">Success Rate</p>
            <div class="stat-value">
              <h2 id="stat-success-rate">...</h2>
            </div>
          </div>
          
          <div class="stat-card">
            <p class="stat-label">Failure Rate</p>
            <div class="stat-value">
              <h2 id="stat-failure-rate" style="color: #ef4444;">...</h2>
            </div>
          </div>
        </div>
        
        <!-- Dashboard Grid -->
        <div class="dashboard-grid">
          <!-- Conversion Performance Chart -->
          <div class="card">
            <div class="card-header">
              <h3>Conversion Performance</h3>
            </div>
            <div class="card-body">
              <div class="chart-legend">
                <div class="legend-item">
                  <span class="legend-dot failure"></span>
                  Failure
                </div>
                <div class="legend-item">
                  <span class="legend-dot success"></span>
                  Success
                </div>
              </div>
              <div class="chart-container">
                <canvas id="conversionChart"></canvas>
              </div>
            </div>
          </div>
          
          <!-- Student Growth -->
          <div class="card">
            <div class="card-header">
                <div style="display:flex; align-items:center; gap:8px;">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                  </svg>
                  <h3>Student Growth</h3>
                </div>
              </div>
              <div class="card-body">
                <div class="chart-container">
                  <canvas id="studentGrowthChart"></canvas>
                </div>
              </div>
            </div>
        </div>  <!-- tutup card student growth -->
        </div>  <!-- tutup dashboard-grid -->

      <!-- Footer -->
      <footer class="as-footer">
        <p>© 2026 EDUFUNNEL DATA SYSTEMS • PRECISION</p>
      </footer>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
